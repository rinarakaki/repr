name: Rust

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - run: rustup install nightly

    # TODO
    # - run: cargo fmt --check

    # TODO
    # - run: cargo clippy --all-targets --all-features

    - run: cargo +nightly build

    - run: cargo +nightly test
